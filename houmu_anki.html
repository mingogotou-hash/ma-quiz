<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法務｜中小企業診断士 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --bg2: #0d1117;
  --bg3: #131924;
  --accent: #3d7eff;
  --accent2: #2a5fcc;
  --correct: #00c9a7;
  --fuzzy: #f5a623;
  --wrong: #ff5252;
  --text: #e8eaf0;
  --text2: #8892a4;
  --border: #1e2535;
  --card-bg: #111827;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ===== TOP SCREEN ===== */
#top {
  padding: 0;
}
.top-header {
  background: linear-gradient(135deg, #0d1117 0%, #131924 100%);
  padding: 28px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.top-header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.top-header .subtitle {
  font-size: 12px;
  color: var(--text2);
}
.overall-progress {
  background: var(--bg2);
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.overall-progress .stats {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
  font-size: 13px;
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-label { color: var(--text2); font-size: 11px; }
.stat-value { font-weight: 700; font-size: 16px; }
.stat-value.correct { color: var(--correct); }
.stat-value.fuzzy { color: var(--fuzzy); }
.stat-value.wrong { color: var(--wrong); }
.progress-bar-wrap {
  background: var(--border);
  border-radius: 4px;
  height: 6px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--correct));
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* フィルタタブ */
.filter-tabs {
  display: flex;
  padding: 12px 16px;
  gap: 8px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  -webkit-overflow-scrolling: touch;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* シート一覧 */
.sheet-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}
.sheet-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.sheet-item:active { transform: scale(0.98); }
.sheet-item:hover { border-color: var(--accent); }
.sheet-name {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
}
.sheet-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 8px;
}
.sheet-bar-wrap {
  background: var(--border);
  border-radius: 4px;
  height: 4px;
  overflow: hidden;
}
.sheet-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--correct));
  border-radius: 4px;
}

.star-filter-row {
  display: flex;
  padding: 8px 16px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.star-btn {
  flex: 1;
  padding: 6px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.star-btn.active {
  background: var(--bg3);
  border-color: var(--accent);
  color: var(--text);
}

/* ===== CARD SCREEN ===== */
#card {
  background: var(--bg);
}
.card-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.btn-back {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
}
.card-title {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-count {
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
}
.progress-line {
  height: 3px;
  background: var(--border);
}
.progress-line-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* カード本体 */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}
.card-stars {
  font-size: 14px;
  margin-bottom: 10px;
  color: #f5a623;
}
.flip-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 20px;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.2s;
  position: relative;
  user-select: none;
}
.flip-card:active { transform: scale(0.98); }
.flip-card.flipped { border-color: var(--accent); }
.card-face { display: none; }
.card-face.visible { display: block; }
.card-q-label {
  font-size: 10px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}
.card-a-label {
  font-size: 10px;
  color: var(--correct);
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}
.card-text {
  font-size: 15px;
  line-height: 1.75;
  font-weight: 500;
}
.card-hint {
  margin-top: 12px;
  font-size: 11px;
  color: var(--text2);
  text-align: center;
}

/* 判定ボタン */
.judge-area {
  padding: 14px 16px;
  display: none;
  gap: 10px;
}
.judge-area.visible { display: flex; }
.judge-btn {
  flex: 1;
  padding: 13px 8px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.judge-btn:active { transform: scale(0.95); }
.judge-btn.correct { background: var(--correct); color: #fff; }
.judge-btn.fuzzy   { background: var(--fuzzy);   color: #fff; }
.judge-btn.wrong   { background: var(--wrong);   color: #fff; }

.nav-row {
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
}
.nav-btn:active { transform: scale(0.96); }
.nav-btn:disabled { opacity: 0.35; }

/* ===== COMPLETE SCREEN ===== */
#complete {
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  text-align: center;
}
.complete-icon { font-size: 64px; margin-bottom: 20px; }
.complete-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
.complete-stats {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin: 20px 0 30px;
}
.c-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.c-stat-value { font-size: 28px; font-weight: 700; }
.c-stat-label { font-size: 11px; color: var(--text2); }
.btn-retry {
  width: 100%;
  max-width: 300px;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 12px;
}
.btn-back2 {
  width: 100%;
  max-width: 300px;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
}

/* Touch swipe hint */
.swipe-hint {
  text-align: center;
  font-size: 10px;
  color: var(--text2);
  padding: 4px 0 8px;
}
</style>
</head>
<body>

<!-- TOP SCREEN -->
<div id="top" class="screen active">
  <div class="top-header">
    <h1>⚖️ 法務</h1>
    <div class="subtitle">中小企業診断士 2025｜SHEET 01〜20｜全213問</div>
  </div>
  <div class="overall-progress">
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">正解</span>
        <span class="stat-value correct" id="total-correct">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">微妙</span>
        <span class="stat-value fuzzy" id="total-fuzzy">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">不正解</span>
        <span class="stat-value wrong" id="total-wrong">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">未学習</span>
        <span class="stat-value" id="total-untouched">213</span>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="overall-bar" style="width:0%"></div>
    </div>
  </div>
  <div class="filter-tabs">
    <button class="filter-btn active" data-f="all" onclick="setFilter('all')">すべて</button>
    <button class="filter-btn" data-f="untouched" onclick="setFilter('untouched')">未習</button>
    <button class="filter-btn" data-f="wrong" onclick="setFilter('wrong')">苦手</button>
    <button class="filter-btn" data-f="shuffle" onclick="setFilter('shuffle')">シャッフル</button>
  </div>
  <div class="star-filter-row">
    <button class="star-btn active" data-s="all" onclick="setStar('all')">全★</button>
    <button class="star-btn" data-s="3" onclick="setStar('3')">★★★</button>
    <button class="star-btn" data-s="2" onclick="setStar('2')">★★</button>
    <button class="star-btn" data-s="1" onclick="setStar('1')">★</button>
  </div>
  <div class="sheet-list" id="sheet-list"></div>
</div>

<!-- CARD SCREEN -->
<div id="card" class="screen">
  <div class="card-header">
    <button class="btn-back" onclick="goTop()">← 一覧</button>
    <div class="card-title" id="card-sheet-title"></div>
    <div class="card-count" id="card-count-label"></div>
  </div>
  <div class="progress-line"><div class="progress-line-fill" id="card-progress-fill"></div></div>
  <div class="card-area">
    <div class="card-stars" id="card-stars"></div>
    <div class="flip-card" id="flip-card" onclick="flipCard()">
      <div class="card-face visible" id="face-q">
        <div class="card-q-label">QUESTION</div>
        <div class="card-text" id="q-text"></div>
        <div class="card-hint">タップで答えを確認</div>
      </div>
      <div class="card-face" id="face-a">
        <div class="card-a-label">ANSWER</div>
        <div class="card-text" id="a-text"></div>
      </div>
    </div>
  </div>
  <div class="swipe-hint">← 前の問題　　次の問題 →</div>
  <div class="judge-area" id="judge-area">
    <button class="judge-btn correct" onclick="judge('correct')">○ 正解</button>
    <button class="judge-btn fuzzy"   onclick="judge('fuzzy')">△ 微妙</button>
    <button class="judge-btn wrong"   onclick="judge('wrong')">✕ 不正解</button>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="goPrev()">◀ 前へ</button>
    <button class="nav-btn" id="btn-next" onclick="goNext()">次へ ▶</button>
  </div>
</div>

<!-- COMPLETE SCREEN -->
<div id="complete" class="screen">
  <div class="complete-icon">🎉</div>
  <div class="complete-title">セクション完了！</div>
  <div class="complete-stats">
    <div class="c-stat">
      <div class="c-stat-value correct" id="comp-correct">0</div>
      <div class="c-stat-label">正解</div>
    </div>
    <div class="c-stat">
      <div class="c-stat-value fuzzy" id="comp-fuzzy">0</div>
      <div class="c-stat-label">微妙</div>
    </div>
    <div class="c-stat">
      <div class="c-stat-value wrong" id="comp-wrong">0</div>
      <div class="c-stat-label">不正解</div>
    </div>
  </div>
  <button class="btn-retry" onclick="retrySection()">もう一度</button>
  <button class="btn-back2" onclick="goTop()">一覧に戻る</button>
</div>

<script>
'use strict';

// ===== DATA =====
var D = [
  {
    title: 'SHEET 01｜会社設立',
    cards: [
      { q: '定款の絶対的記載事項を6つ答えよ。', a: '①目的（会社の事業内容）、②商号、③本店の所在地、④設立に際して出資される財産の価額またはその最低額、⑤発起人の氏名または名称および住所、⑥発行可能株式総数', s: 3 },
      { q: '定款の「変態設立事項」とは何か？なぜ検査役が必要か？', a: '現物出資の価額など、過大評価による詐欺的設立を防ぐため裁判所が検査役選任を命じる4事項。①現物出資の価額、②財産引受の価額、③発起人が受ける報酬・特別利益、④設立費用', s: 3 },
      { q: '検査役選任の申立てが「不要」になる3つの例外条件は？', a: '①総額が500万円以下、②市場価格のある有価証券、③弁護士・公認会計士・税理士（不動産は不動産鑑定士）の証明を受けたとき', s: 3 },
      { q: '発起設立と募集設立の違いは何か？払込金保管証明書の要否で答えよ。', a: '発起設立：払込金保管証明書不要（自分のお金なので）。募集設立：要（みんなのお金なので）。どちらも発起人は1株以上引き受ける', s: 3 },
      { q: '現物出資ができるのは誰か？', a: '発起人のみ（複数人でもOK）', s: 2 },
      { q: '定款変更には何が必要か？', a: '株主総会の特別決議', s: 2 },
      { q: '個人事業主の開業届は、いつまでにどこへ提出するか？', a: '1か月以内に税務署へ', s: 2 },
      { q: '法人設立届出書は、いつまでにどこへ提出するか？', a: '2か月以内に税務署へ', s: 2 },
      { q: '従業員を雇用したとき、労働保険（労基署）への保険関係成立届はいつまでに提出するか？', a: '10日以内に労働基準監督署（＋ハローワーク）へ', s: 2 },
      { q: '社会保険の新規適用届は、いつまでにどこへ提出するか？対象規模は？', a: '5日以内に年金事務所へ。個人事業主は5人以上、法人は1人以上から強制加入', s: 2 },
      { q: '同一商号かつ同一住所の登記は認められるか？', a: '認められない（禁止）', s: 2 }
    ,
      { q: '登記が必要な主な事項を3つ答えよ。', a: '①商号・本店所在地・目的・資本金の額、②発行可能株式総数・発行済株式総数・株式の内容、③代表取締役：氏名＋住所、取締役：氏名', s: 2 },
      { q: '「原始定款」と「現行定款」の違いは？', a: '原始定款：会社設立時に作成され公証人によって認証された定款。現行定款：現時点で効力を持っている定款（変更を反映した最新のもの）', s: 2 }
    ]
  },
  {
    title: 'SHEET 02｜株式会社の機関設計',
    cards: [
      { q: '取締役の任期は原則何年か？非公開会社での例外は？', a: '原則2年（短縮OK）。非公開会社は定款で10年まで伸長OK。三委員会設置会社は1年（短縮OK）', s: 3 },
      { q: '監査役の任期は何年か？短縮・伸長の可否は？', a: '4年（短縮NG）。非公開会社は定款で10年まで伸長OK', s: 3 },
      { q: '会計参与の任期は？', a: '2年（短縮OK）', s: 2 },
      { q: '会計監査人の任期は？短縮・伸長の可否は？', a: '1年（短縮・伸長NG）', s: 3 },
      { q: '取締役の解任に必要な決議は？監査役と比べて答えよ。', a: '取締役：株主総会普通決議で解任可。監査役：株主総会特別決議が必要（より強い身分保障）', s: 3 },
      { q: '株主総会の書面投票・電子投票を採用する会社の招集通知はいつまでに必要か？', a: '2週間前まで', s: 2 },
      { q: '監査役会の可決要件と定足数の考え方は？', a: '過半数の賛成が必要。定足数の概念なし', s: 3 },
      { q: '会計限定監査役を置けるのはどんな会社か？', a: '非公開会社（監査の範囲を会計のみに絞った監査役）', s: 2 },
      { q: '会計監査人を解任できるのは誰か、どんな場合か？', a: '監査役（監査役会・監査委員会・監査等委員会）の全員の合意で解任可。取締役会・株主総会決議は不要', s: 3 },
      { q: '大会社の定義を答えよ。', a: '資本金5億円以上 または 負債総額200億円以上', s: 3 },
      { q: '公開かつ大会社に義務付けられている機関は何か？', a: '取締役会、監査役会（または三委員会・監査等委員会）、会計監査人（すべて必須）', s: 3 },
      { q: '取締役会の定足数と表決数を答えよ。定款変更の可否も含めて。', a: '定足数：取締役の過半数。表決数：出席者の過半数。定款で加重はできるが軽減はできない', s: 3 }
    ,
      { q: '株主総会招集手続で「取締役会設置会社の場合」と「なし」の通知方法の違いは？', a: '取締役会設置会社：書面または電磁的方法（口頭は×）。取締役会なし：書面・電磁的・口頭いずれも可', s: 3 },
      { q: '監査役会設置会社の監査役の要件（人数・社外比率）は？', a: '最低3人。うち半数以上は社外監査役でなければならない（合議制）', s: 3 },
      { q: '取締役会が「必ず決定する」事項（専決事項）を5つ答えよ。', a: '①重要な財産の処分・譲受け、②多額の借財、③代表取締役の選任・解任、④支店など重要な組織の設置・変更・廃止、⑤社債の発行に関する事項', s: 3 }
    ]
  },
  {
    title: 'SHEET 03｜株式会社の機関の詳細①',
    cards: [
      { q: '株主総会普通決議の定足数と表決数は？数値例も示せ。', a: '定足数：議決権を行使できる株主の議決権の過半数。表決数：出席株主の議決権の過半数。（例）100株なら51人出席で26票以上', s: 3 },

      { q: '景品表示法の「一般懸賞」で取引金額が5,000円未満の場合の景品最高額は？5,000円以上は？', a: '5,000円未満：取引金額×20倍。5,000円以上：最高10万円。総付景品：1,000円未満は200円、1,000円以上は取引金額×1/5', s: 3 },

      { q: '特定電子メール（迷惑メール）を事前同意なく送ってよい相手は？', a: '①名刺など書面でアドレスを知った人、②自分のアドレスをネットで公表している企業・個人事業主（消費者は事前同意必要）、③取引関係にある人', s: 3 },
      { q: 'フランチャイズ契約で加盟店（フランチャイジー）保護のため、本部に義務付けられていることは？', a: '取引条件を書面で開示する義務。また表見代理・使用者責任・名板貸し責任が発生する可能性がある', s: 2 }

  }

// ===== STATE =====
var STORAGE_KEY = 'houmu_v1';
var records = {};
var currentFilter = 'all';
var currentStar = 'all';
var currentSheetIdx = -1;
var currentCards = [];
var currentCardIdx = 0;
var isFlipped = false;

// ===== STORAGE =====
function loadRecords() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    records = raw ? JSON.parse(raw) : {};
  } catch(e) { records = {}; }
}
function saveRecords() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e) {}
}
function getKey(si, ci) { return si + '_' + ci; }
function getResult(si, ci) { return records[getKey(si, ci)] || 'untouched'; }
function setResult(si, ci, result) {
  records[getKey(si, ci)] = result;
  saveRecords();
}

// ===== SWIPE =====
var touchStartX = 0;
function initSwipe() {
  var fc = document.getElementById('flip-card');
  fc.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, {passive:true});
  fc.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) goNext();
      else goPrev();
    }
  }, {passive:true});
}

// ===== FILTER =====
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.f === f);
  });
  renderTopScreen();
}
function setStar(s) {
  currentStar = s;
  document.querySelectorAll('.star-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.s === s);
  });
  renderTopScreen();
}

// ===== STATS =====
function calcStats() {
  var correct = 0, fuzzy = 0, wrong = 0, total = 0;
  D.forEach(function(sheet, si) {
    sheet.cards.forEach(function(card, ci) {
      total++;
      var r = getResult(si, ci);
      if (r === 'correct') correct++;
      else if (r === 'fuzzy') fuzzy++;
      else if (r === 'wrong') wrong++;
    });
  });
  return { correct: correct, fuzzy: fuzzy, wrong: wrong, total: total, untouched: total - correct - fuzzy - wrong };
}

function calcSheetStats(si) {
  var correct = 0, fuzzy = 0, wrong = 0, total = 0;
  D[si].cards.forEach(function(card, ci) {
    total++;
    var r = getResult(si, ci);
    if (r === 'correct') correct++;
    else if (r === 'fuzzy') fuzzy++;
    else if (r === 'wrong') wrong++;
  });
  return { correct: correct, fuzzy: fuzzy, wrong: wrong, total: total };
}

// ===== TOP SCREEN =====
function renderTopScreen() {
  var stats = calcStats();
  document.getElementById('total-correct').textContent = stats.correct;
  document.getElementById('total-fuzzy').textContent = stats.fuzzy;
  document.getElementById('total-wrong').textContent = stats.wrong;
  document.getElementById('total-untouched').textContent = stats.untouched;
  var pct = stats.total > 0 ? Math.round((stats.correct + stats.fuzzy) / stats.total * 100) : 0;
  document.getElementById('overall-bar').style.width = pct + '%';

  var list = document.getElementById('sheet-list');
  list.innerHTML = '';

  // シャッフルモード：全問シャッフルで一括起動
  if (currentFilter === 'shuffle') {
    var allCards = buildFilteredCards(-1);
    var allShuffle = shuffle(allCards);
    var div = document.createElement('div');
    div.className = 'sheet-item';
    div.innerHTML = '<div class="sheet-name">🔀 シャッフルモード（全問）</div><div class="sheet-meta"><span>' + allShuffle.length + '問</span></div>';
    div.onclick = function() { startSession(-1, allShuffle); };
    list.appendChild(div);
    return;
  }

  D.forEach(function(sheet, si) {
    var cards = buildFilteredCards(si);
    if (cards.length === 0) return;
    var ss = calcSheetStats(si);
    var pct2 = ss.total > 0 ? Math.round(ss.correct / ss.total * 100) : 0;
    var div = document.createElement('div');
    div.className = 'sheet-item';
    div.innerHTML = '<div class="sheet-name">' + sheet.title + '</div>'
      + '<div class="sheet-meta"><span>対象: ' + cards.length + '問</span><span>正解率 ' + pct2 + '%</span></div>'
      + '<div class="sheet-bar-wrap"><div class="sheet-bar-fill" style="width:' + pct2 + '%"></div></div>';
    div.onclick = (function(idx, c) { return function() { startSession(idx, c); }; })(si, cards);
    list.appendChild(div);
  });
}

function buildFilteredCards(si) {
  var cards = [];
  var sheets = si === -1 ? D.map(function(_, i){ return i; }) : [si];
  sheets.forEach(function(idx) {
    D[idx].cards.forEach(function(card, ci) {
      if (!matchStar(card.s)) return;
      if (!matchFilter(idx, ci)) return;
      cards.push({ si: idx, ci: ci, card: card });
    });
  });
  return cards;
}

function matchStar(s) {
  if (currentStar === 'all') return true;
  return String(s) === currentStar;
}

function matchFilter(si, ci) {
  var r = getResult(si, ci);
  if (currentFilter === 'all' || currentFilter === 'shuffle') return true;
  if (currentFilter === 'untouched') return r === 'untouched';
  if (currentFilter === 'wrong') return r === 'wrong' || r === 'fuzzy';
  return true;
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ===== SESSION =====
function startSession(sheetIdx, cards) {
  currentSheetIdx = sheetIdx;
  currentCards = cards;
  currentCardIdx = 0;
  showScreen('card');
  renderCard();
}

function renderCard() {
  if (currentCards.length === 0) return;
  var item = currentCards[currentCardIdx];
  var card = item.card;

  var title = currentSheetIdx === -1 ? 'シャッフルモード' : D[currentSheetIdx].title;
  document.getElementById('card-sheet-title').textContent = title;
  document.getElementById('card-count-label').textContent = (currentCardIdx + 1) + ' / ' + currentCards.length;

  var stars = '';
  for (var i = 0; i < card.s; i++) stars += '★';
  document.getElementById('card-stars').textContent = stars;

  document.getElementById('q-text').textContent = card.q;
  document.getElementById('a-text').textContent = card.a;

  var pct = currentCards.length > 0 ? ((currentCardIdx + 1) / currentCards.length * 100) : 0;
  document.getElementById('card-progress-fill').style.width = pct + '%';

  // reset flip
  isFlipped = false;
  var fc = document.getElementById('flip-card');
  fc.classList.remove('flipped');
  document.getElementById('face-q').classList.add('visible');
  document.getElementById('face-a').classList.remove('visible');
  document.getElementById('judge-area').classList.remove('visible');

  document.getElementById('btn-prev').disabled = currentCardIdx === 0;
  document.getElementById('btn-next').disabled = currentCardIdx === currentCards.length - 1;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  var fc = document.getElementById('flip-card');
  fc.classList.add('flipped');
  document.getElementById('face-q').classList.remove('visible');
  document.getElementById('face-a').classList.add('visible');
  document.getElementById('judge-area').classList.add('visible');
}

function judge(result) {
  var item = currentCards[currentCardIdx,
      { q: '個人情報保護法の「個人情報取扱事業者の義務」を3つ答えよ。', a: '①個人情報の利用目的を本人に通知・公表する、②個人データを安全に管理し従業員や委託先も監督する、③第三者に渡すときは原則としてあらかじめ本人の同意（オプトイン）を得る', s: 3 },
      { q: '消費者契約法の「不当な勧誘」に該当する行為を3つ答えよ。', a: '①不退去（買うまで帰らない/帰さない）、②断定的判断の提供（絶対に儲かりますなど）、③過量契約（独居老人に大量に布団を売るなど）', s: 3 }
    ];
  setResult(item.si, item.ci, result);
  if (currentCardIdx < currentCards.length - 1) {
    currentCardIdx++;
    renderCard();
  } else {
    showComplete();
  }
}

function goPrev() {
  if (currentCardIdx > 0) {
    currentCardIdx--;
    renderCard();
  }
}

function goNext() {
  if (currentCardIdx < currentCards.length - 1) {
    currentCardIdx++;
    renderCard();
  }
}

function showComplete() {
  var correct = 0, fuzzy = 0, wrong = 0;
  currentCards.forEach(function(item) {
    var r = getResult(item.si, item.ci);
    if (r === 'correct') correct++;
    else if (r === 'fuzzy') fuzzy++;
    else if (r === 'wrong') wrong++;
  });
  document.getElementById('comp-correct').textContent = correct;
  document.getElementById('comp-fuzzy').textContent = fuzzy;
  document.getElementById('comp-wrong').textContent = wrong;
  showScreen('complete');
}

function retrySection() {
  startSession(currentSheetIdx, currentCards);
}

function goTop() {
  showScreen('top');
  renderTopScreen();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.toggle('active', s.id === id);
  });
}

// ===== INIT =====
loadRecords();
renderTopScreen();
initSwipe();
</script>
