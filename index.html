<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#16161f;--accent:#6c5ce7;--accent2:#a29bfe;--correct:#00b894;--wrong:#d63031;--text:#e8e8e8;--sub:#8a8a9a;--border:#2d2d3f}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.app{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top,12px) 16px 100px}
.header{text-align:center;padding:16px 0 12px}
.header h1{font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .sub{font-size:11px;color:var(--sub);margin-top:4px}
.stats-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:12px}
.stats-bar .pw{flex:1;height:6px;background:var(--card);border-radius:3px;margin:0 12px;overflow:hidden}
.stats-bar .pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--correct));transition:width .4s}
.stats-bar span{font-weight:700;font-size:13px;min-width:36px;text-align:center}
.card-wrap{perspective:1200px;margin:16px 0;animation:si .3s ease}
@keyframes si{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.card{position:relative;width:100%;min-height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.card.fl{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center}
.cfr{background:linear-gradient(145deg,#1a1a2e,#16213e);border:1px solid var(--border)}
.cfr .lb{font-size:10px;font-weight:700;color:var(--accent2);letter-spacing:2px;margin-bottom:12px}
.cfr .qt{font-size:15px;line-height:1.7;font-weight:600}
.cfr .ht{position:absolute;bottom:16px;right:20px;font-size:10px;color:var(--sub)}
.cbk{background:linear-gradient(145deg,#0d2818,#1a3a2a);border:1px solid rgba(0,184,148,.3);transform:rotateY(180deg)}
.cbk .lb{font-size:10px;font-weight:700;color:var(--correct);letter-spacing:2px;margin-bottom:12px}
.cbk .an{font-size:14px;line-height:1.8}
.cn{position:absolute;top:16px;right:20px;font-size:11px;color:var(--sub);font-weight:600}
.acts{display:flex;gap:10px;justify-content:center;margin:16px 0}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;-webkit-appearance:none}
.btn:active{transform:scale(.96)}
.bw{background:rgba(214,48,49,.15);color:var(--wrong);border:1px solid rgba(214,48,49,.3)}
.bo{background:rgba(108,92,231,.15);color:var(--accent2);border:1px solid rgba(108,92,231,.3)}
.bc{background:rgba(0,184,148,.15);color:var(--correct);border:1px solid rgba(0,184,148,.3)}
.mt{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.mb{padding:6px 14px;border-radius:16px;font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--sub);cursor:pointer;transition:.2s;-webkit-appearance:none}
.mb.ac{background:var(--accent);color:#fff;border-color:var(--accent)}
.cl{display:grid;gap:8px;margin:12px 0}
.ci{padding:14px 16px;background:var(--card);border-radius:12px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
.ci:active{transform:scale(.98)}
.ci .ct{font-size:13px;font-weight:600;flex:1}
.ci .cs{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--sub)}
.ci .cb{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ci .cbf{height:100%;background:var(--correct);border-radius:2px;transition:width .3s}
.rb{display:block;margin:20px auto;padding:8px 20px;border-radius:10px;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--sub);cursor:pointer;font-family:inherit;-webkit-appearance:none}
.em{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:12px 16px calc(env(safe-area-inset-bottom,8px) + 8px);background:linear-gradient(transparent,var(--bg) 30%)}
.nb{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--sub);cursor:pointer;font-family:inherit;-webkit-appearance:none}
.nb:active{transform:scale(.96)}
.nb.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const D=[{"title": "第1章 M&A総論", "cards": [{"q": "経済産業省は、これまでの親族内承継重視から何を重視する政策にシフトしたか？", "a": "第三者承継重視の政策にシフトした"}, {"q": "経済産業省が公表した、中小M&A（第三者承継）の年間目標件数は？", "a": "2030年まで毎年6万件／年に増やすという目標"}, {"q": "「第三者承継支援総合パッケージ」の集中実施期間と目標は？", "a": "10年間の集中実施で、6万件/年×10年＝60万件の第三者承継の実現を目指す"}, {"q": "第三者承継支援総合パッケージにおいて、技術・雇用等の中小企業の経営資源を次世代の意欲ある経営者に何するとしているか？", "a": "承継・集約する"}, {"q": "中小M&Aを推進する意義において、企業のライフサイクル上の「課題①」とは何か？", "a": "経営者のEXITの手段がなく、後継者がいない場合は廃業となること（後継者不在の問題）"}, {"q": "中小M&Aを推進する意義における「M&Aの効果①」とは？", "a": "経営資源が散逸することの回避"}, {"q": "中小M&Aを推進する意義における「課題②」とは何か？", "a": "成長期に経営資源が限られ、大胆な新事業展開等が困難になること（生産性の低迷）"}, {"q": "中小M&Aを推進する意義における「M&Aの効果②」とは？", "a": "新たな経営資源を活用した規模拡大等による成長"}, {"q": "中小M&Aを推進する意義における「課題③」とは何か？", "a": "創業時のリスクが大きく、創業しづらいこと（開業率の低迷）"}, {"q": "中小M&Aを推進する意義における「M&Aの効果③」とは？", "a": "創業時のリスクを軽減した状態からの事業開始"}, {"q": "中小M&Aを推進するための主な支援措置のうち「補助金」の4つの枠とは？", "a": "①事業承継促進枠、②専門家活用枠、③PMI推進枠、④廃業・再チャレンジ枠"}, {"q": "事業承継促進枠の補助上限額と補助率は？", "a": "補助上限800万円、補助率1/2"}, {"q": "専門家活用枠の補助上限額は？", "a": "買手支援600万円、売手支援600万円"}, {"q": "PMI推進枠の補助上限額は？", "a": "専門家活用150万円、事業統合投資800万円"}, {"q": "廃業・再チャレンジ枠の補助上限額と補助率は？", "a": "補助上限150万円、補助率1/2"}, {"q": "中小企業事業再編投資損失準備金とは何か？", "a": "M&A実施後のリスクに備えるための準備金制度で、株式取得価額の70%以下を損金算入でき（1回目）、2回目以降は株式取得価額の100%の額を損金算入できる"}, {"q": "不動産取得の特例とは何か？", "a": "経営力向上計画の認定を受けた後、他の事業者から事業承継を行った場合で、不動産の権利移転等に関しても不動産取得税の軽減が受けられる特例"}, {"q": "中小M&Aガイドライン（第3版）改訂で拡充された3つの大項目は？", "a": "①提供業務等の具体的説明事項、②禁止事項・規律、③リスク事項の解説と対応策"}, {"q": "中小M&Aガイドライン（第3版）で新たに盛り込まれた主な内容を4つ挙げよ", "a": "①手数料の説明と手数料がM&A成立に及ぼす影響の説明、②広告・営業の禁止事項、③利益相反にかかる禁止事項の具体化、④ネームクリア・テール条項に関する規律"}, {"q": "中小M&Aガイドライン（第3版）で言及された「リスク事項」に関する内容を3つ挙げよ", "a": "①最終契約後の当事者間のリスク事項について、②譲り渡し側の経営者保証の扱いについて、③不適切な事業者の排除について"}, {"q": "事業承継の主な方法は3つあるが、それぞれ何か？（株式と相は対象外）", "a": "①親族承継、②社員承継、③M&A"}, {"q": "親族承継の承継先は誰か？", "a": "息子・娘・婿・嫁・甥・姪"}, {"q": "社員承継の承継先は誰か？", "a": "社員"}, {"q": "M&Aの承継先は誰か？", "a": "第三者"}, {"q": "廃業の場合、従業員の雇用はどうなるか？", "a": "解雇"}, {"q": "親族承継・社員承継・M&Aのいずれにおいても共通して期待できることは？", "a": "従業員の雇用維持"}, {"q": "親族承継と社員承継における「関係者の理解」の違いは？", "a": "親族承継は得やすい。社員承継も得やすい"}, {"q": "M&Aにおける「関係者の理解」の特徴は？", "a": "得られにくい（M&Aに対する心理的抵抗がある場合がある）"}, {"q": "社員承継における「株式の引継ぎ費用」の課題は何か？", "a": "親族以外のため贈与・相続を使えないため、株式買取資金と連帯保証の引継ぎが課題となる"}, {"q": "M&Aにおける「株式の引継ぎ費用」の特徴は？", "a": "譲受企業の資力に応じて対応可能"}, {"q": "親族も従業員も継げない場合、選択肢は何か？", "a": "「M&A」か「廃業」の二択となる"}, {"q": "M&Aによる事業承継が一般的な選択肢になりつつある背景は？", "a": "息子が別の道に進み会社を継がない、従業員に承継させたいが株の買取資金や連帯保証の引継ぎの問題がある等のケースが急増している"}, {"q": "業界再編が進行しつつある業界を6つ挙げよ", "a": "調剤薬局、トラック運送業、IT関連業、製造業、建設業、食品関連業"}, {"q": "調剤薬局業界でM&Aが進む背景は？", "a": "コンビニより多い約6万店舗があり、調剤報酬改定で事業の集約化が進み、ドラッグストア等との競争激化がある"}, {"q": "トラック運送業界でM&Aが進む背景は？", "a": "事業者数が約6万社と多く、残業時間の規制（2024年問題）や燃油価格高騰の圧力がある"}, {"q": "IT関連業界でM&Aが進む背景は？", "a": "慢性的なエンジニア不足、技術者の高齢化、ビジネスモデルの変化があり、譲渡オーナーの平均年齢が約56歳と比較的若い"}, {"q": "上記の業界再編が進む業界のM&Aの特徴は？", "a": "後継者問題に限らないM&A（＝若いオーナーの譲渡）も多い"}, {"q": "非上場企業（中堅中小企業）のM&Aで最も多く活用されるスキームは？", "a": "株式譲渡（86.8%）"}, {"q": "事業譲渡の比率はどのくらいか？", "a": "8.3%"}, {"q": "会社分割の比率はどのくらいか？", "a": "2.1%"}, {"q": "合併の比率はどのくらいか？", "a": "0.2%"}, {"q": "非上場企業のM&Aにおいて「合併」が少ない理由は？", "a": "M&Aによって法人格が消滅することは事例として少ないため"}, {"q": "株式譲渡とは何か？", "a": "現在の株主と譲受け企業との株式の売買のこと"}, {"q": "株式譲渡の場合、変わるのは何か？", "a": "変わるのは株主（出資者・役員）のみ"}, {"q": "株式譲渡で変わらないものを5つ挙げよ", "a": "①会社名や屋号、②取引先との契約関係、③仕入先との契約関係、④会社名や所在・拠点、⑤就業規則・福利厚生"}, {"q": "成約している譲渡企業（売り手）の売上高の特徴は？", "a": "20億円以下の売上高の会社が全体の90%以上（平均601百万円、中位315百万円）"}, {"q": "譲渡企業の成約時の代表者年齢分布の特徴は？", "a": "60歳未満の経営者が約4割、60歳代の経営者が約3割"}, {"q": "M&A売却・事業譲渡の支援プレイヤーの区分を、想定売上規模別に述べよ", "a": "大企業（300億円以上）→投資銀行・ファンド、中堅企業（50億〜300億円）・中小企業（2億〜50億円）・零細企業（2億円未満）→M&A仲介会社、個人事業主→M&Aネットサービス"}, {"q": "FA（ファイナンシャル・アドバイザー）の役割は？", "a": "企業買収の戦略・戦術の企画立案・実行・交渉にあたるコンサルタント。売り手と買い手がそれぞれ代理人をたてる"}, {"q": "仲介の役割は？", "a": "当事者双方の意見調整により案件をまとめる仲介業務を行う仲人"}, {"q": "仲介者の心構えとして最も重要なことは何か？", "a": "「顧客の利益を最大に考え、自己及び特定の第三者の利益を優先させてはならない」こと"}, {"q": "中小M&Aガイドライン上、仲介業務を行う場合に必ず遵守すべき事項（初版）を3つ挙げよ", "a": "①契約締結前に売り手側・買い手側の両当事者と仲介契約を締結する仲介者であることを伝える、②利益相反のおそれがある事項について各当事者に対して明示的に説明を行う、③利益相反のおそれのある事項を認識した場合は適時に明示的に開示する"}, {"q": "仲介における利益相反の具体例を2つ挙げよ", "a": "①リピーターとなり得る買い手の利益を優先して商談を進めようとすること、②譲渡額が増加すると手数料が増加する場合は売り手の利益を優先して進めようとすること"}, {"q": "中小M&Aガイドライン（第2版）で追加された仲介業務の遵守事項を3つ挙げよ", "a": "①依頼者との間の契約上の義務（善管注意義務・忠実義務）の履行と職業倫理の遵守、②契約に係る重要事項を記載した書面を交付して説明し十分な検討時間を与える、③直接交渉制限の条項における候補先はM&A専門業者が関与・接触し紹介した候補先のみに限定する"}, {"q": "M&Aの基本ステップにおいて、譲渡希望企業側の初期段階（約3ヶ月）の流れを順に述べよ", "a": "個別相談→契約重要事項の説明→提携仲介契約の締結→支援チームの組成→資料提供→企業評価"}, {"q": "譲渡企業側のM&Aステップにおける仲介機関との連携部分は？", "a": "企業概要書（ノンネーム・詳細）の作成→譲受け候補企業一覧の提示→マッチング"}, {"q": "譲受け希望企業側のM&Aステップ（初期〜約2ヶ月）の流れは？", "a": "戦略立案コンサルティング/プロアクティブサーチ→企業概要書（ノンネーム）検討→秘密保持契約の締結→企業概要書（詳細）検討→買収監査方針の確認→意思確認書類の確認"}, {"q": "トップ面談以降のM&Aステップを順に述べよ", "a": "トップ面談・現地視察→譲渡価格等の条件交渉・調整→基本合意契約書の締結（独占交渉権の発生）→デューデリジェンス（買収監査・DD）→最終条件の交渉・調整→最終契約の締結・デリバリー・決済→ディスクロージャー→PMI支援"}, {"q": "譲渡企業のM&Aステップ③における「提携仲介契約」のポイントとなる事項を10項目挙げよ", "a": "業務範囲、秘密保持、コスト（着手金・成功報酬）、実費の負担、有効期間、専任依頼、直接交渉の禁止、候補先との契約、仲介者の義務と免責、反社条項"}, {"q": "後継者問題に伴う譲渡ニーズ（概ね60歳以上のオーナー）のヒアリングポイントを4つ挙げよ", "a": "①後継者候補をオーナーからヒアリングできているか、②後継者候補に承継意志があるか、③後継者候補に経営能力があるか、④特に従業員承継の場合株の買取資金と連帯保証の問題をクリアできるか"}, {"q": "親族も従業員も継げない場合、どのような選択肢となるか？", "a": "「M&A」か「廃業」の二択となる"}, {"q": "後継者問題に限らない譲渡ニーズ（概ね59歳以下のオーナー）の特徴は？", "a": "M&Aに対する抵抗は低い世代で情報収集しているケースが多い。実は譲渡の検討をしている場合がある（早期リタイアや成長戦略目的）"}, {"q": "若いオーナーへのアプローチで重要なことは？", "a": "一見するとニーズが見えないケースが多いため、とにかくヒアリングすることが重要。M&Aへの抵抗は薄く、聞くと意外と教えてくれる"}, {"q": "トップ面談における「売り手（譲渡希望企業）の目的」は何か？", "a": "「自社の経営を委ねることができる相手かどうか」「自社をさらに発展させることのできる相手かどうか」の見極め"}, {"q": "トップ面談における「買い手（譲受け希望企業）の目的」は何か？", "a": "シナジー効果と将来ビジョンの明確化、買収後にグループ企業として経営していけるかの見極め、特に送り込む人材はいるかの確認"}, {"q": "トップ面談の掟を3つ挙げよ", "a": "①仲介者は橋渡し役、②買い手には必ずビジョンを語ってもらう、③買い手は質問の的を絞る（失言は避ける）"}, {"q": "トップ面談で売り手が注意すべきことは？", "a": "短時間で相手を把握するようにすること"}, {"q": "トップ面談の「段取りの良し悪しで今後に影響」するポイントは？", "a": "事前打合せ（シナリオ作り）と根回し"}, {"q": "トップ面談の成否でほぼ何が決まるか？", "a": "M&Aの成否がほぼ決まる"}, {"q": "トップ面談の場所選定や出席メンバーの選定で確認すべき点を3つ挙げよ", "a": "①譲渡企業の企業理念・経営方針・営業面の質疑、②トップ同士の気が合うか、③金額面等の話はしないこと"}, {"q": "トップ面談で重要な4つの行動は？", "a": "①書面上から実際会って相手の人間性と経営理念を理解する、②リラックスさせるためあらかじめ買収企業側から出される想定質問を売り手企業に準備させる、③譲受け後の経営戦略を語ってもらう、④具体的なスケジュールの提出で両社をレールに乗せる効果を狙う"}, {"q": "譲受け企業のM&Aステップ②において、基本合意契約書の締結により何が発生するか？", "a": "独占交渉権の発生"}, {"q": "基本合意契約書締結後に行われるプロセスは何か？", "a": "デューデリジェンス（買収監査・DD）"}]}, {"title": "第2章 倫理規程・自主規制ルール", "cards": [{"q": "M&A支援機関協会の3つの規程の名称は？", "a": "①禁止規範、②行為規範、③組織規範"}, {"q": "禁止規範の目的は何か？", "a": "苦情・トラブル等への対処"}, {"q": "行為規範の目的は何か？", "a": "会員の質の向上や選別"}, {"q": "組織規範の目的は何か？", "a": "実効性確保"}, {"q": "禁止規範の主な内容を2つ挙げよ", "a": "①様々な禁止事項（嘘や迷惑をかける広告・営業はダメ）、②利益相反5類型の禁止"}, {"q": "行為規範の主な内容を4つ挙げよ", "a": "①M&A成立後のリスク説明、②企業情報の重要事項説明、③重説実施方法・対象の充実化、④報酬体系の開示"}, {"q": "組織規範の主な内容を4つ挙げよ", "a": "①監査の仕組み、②苦情窓口の設置、③ブティックの簡易特例の存在、④協会調査と退会規定"}, {"q": "コンプライアンス規程において会員が遵守すべきルールで特に重要な3点は？", "a": "①利益相反行為の禁止、②報酬体系の開示、③高いレベルの実効性確保措置"}, {"q": "利益相反行為の禁止（第四条第二号）で絶対禁止とされる5つの類型を挙げよ", "a": "①追加手数料の見返りとしての優先マッチング、②追加手数料の見返りとしての価格操作、③希望価格よりも高く売却／安く買収できた場合にその差額の一定割合の要求、④非伝達事項を故意に伝達しない・偽って伝達、⑤リピーターである依頼者を優遇"}, {"q": "報酬体系の開示（第五条第2項）で会員が定めて公開すべき内容は？", "a": "報酬基準（報酬基準額・報酬率及び報酬の発生時点・最低手数料など）を定め、ウェブサイト上の企業概要などにおいて一般に公開しなければならない。変更の際も同じ"}, {"q": "実効性確保措置（第三条など）で経営者が自ら率先して行うべきことは？", "a": "コンプライアンス体制を整備の上、その実効性を確保しなければならないと規定した上で、詳細な規定を整備すること"}, {"q": "実効性確保措置として求められる5つの具体的取組みは？", "a": "①コンプライアンス責任者の設置・社内体制の構築・代表者による社内教育など、②相談・通報窓口の設置・運用と年1度以上の監査の実施、③人事評価制度等に対するコンプライアンス遵守状況の反映、④就業規則の整備や適切な懲戒権の行使、⑤協会による独立した調査の実施と必要な措置の実施や報告義務等"}, {"q": "組織規範における「ブティックの簡易特例」とは何か？", "a": "小規模なM&A支援機関（ブティック）に対して、組織規範の一部要件を簡易化した特例措置"}, {"q": "広告・営業規程の目的は何か？", "a": "単に悪質な広告・営業に対処するだけではなく、M&A仲介業者が関与する中小企業M&Aの受託からクロージングまでの全過程をカバーし、業界全体の健全な発展と地位の向上を図り、もって依頼者の利益の保護を目指すこと"}, {"q": "広告・営業規程の「総則／雑則」で共通の総則規定事項として挙げられる6項目は？", "a": "①法令遵守、②秘密保持、③依頼者への忠実義務と十分な説明、④支援機関同士の相互連携、⑤恣意的利益誘導の禁止、⑥M&A適適合性原則"}, {"q": "広告規程（第五条）における「マス広告」と「特定広告」の区別は？", "a": "広く一般大衆に向けてのマス広告と、特定人に向けての特定広告を区別している"}, {"q": "広告規程で禁止されている広告行為の例を3つ挙げよ", "a": "①不実表示の禁止、②フィッシング広告の禁止、③誤導広告の禁止"}, {"q": "営業規程で具体的に規定されている営業上の義務を4つ挙げよ", "a": "①秘密保持・インサイダー取引の防止、②企業に関する重要事項の説明、③営業の連携等に対する報告義務と営業上の伝達の適正・緻密なマッチングの実現、④M&A成立後のリスク事項についての説明義務"}, {"q": "営業規程で禁止されている営業上の行為を7つ挙げよ", "a": "①契約に定めていない追加報酬の要求禁止、②ディール・ブレイク要因の隠匿の禁止、③即時判断を迫る行為の禁止、④成功的貢献の禁止、⑤テール条項の不当利用の禁止、⑥依頼者の自由意思による親族内承継などへの切り替えを妨害する行為の禁止、⑦不適切な営業行為の禁止"}, {"q": "協会のガバナンス改革におけるキーワードは何か？", "a": "仲間内の運営からの脱却・お手盛りの防止・開かれた運営・有識者の英知の結集"}, {"q": "不適切事業者の登録制度（2024年10月運用開始時）の制度設計概要で「自動登録」でない点が課題とされたが、その制度の流れは？", "a": "①売り手が登録事由を認識→②参加会員が協会に報告→③調査実施（会員提出資料など）→④書面で弁明の機会を付与（本人に通知、最低2週間）→⑤理事会判断で登録決定（年4回）→リストに掲載→参加会員が受託時にリスト閲覧（会員用サイト）"}, {"q": "不適切事業者の登録事由を2つ挙げよ", "a": "①経営者保証60営業日以上未解除、②本競法等の継続未解決4か月以上未解除"}, {"q": "登録事由で最低6か月以上、弁明の機会で最低何週間かかるか？", "a": "最低2週間（1回延長可）"}, {"q": "理事会の登録判断は何か月に1度行われるか？", "a": "3か月に1度"}, {"q": "2025年2月にリリースされた画期的な行政文書（中企庁）のポイントを3つ挙げよ", "a": "①客観的登録要件4つによる自動登録とバスケット条項、②後払いの不払いや分割払いの不履行も自動登録、③独禁法上の取引拒絶にならないように運用"}, {"q": "行政文書を受けてブラッシュアップされた仕組み（新制度）の登録事由を5つ挙げよ", "a": "①経営者保証60営業日以上未解除、②金融機関等へ10営業日以内に相続行かず、③本競法等の継続から20営業日以内に債務不実施、④後払いや分割払いの精口精算、⑤バスケット条項"}, {"q": "新制度におけるリスト登録期間は？", "a": "10年間登録"}, {"q": "新制度では自動登録を基本としているが、バスケット条項以外の登録はどのように処理されるか？", "a": "自動登録（⑤のバスケット条項は従来通りの調査手続きを経て登録）"}, {"q": "新制度における報告ルートの特徴は？", "a": "②は複数ルートあり（参加会員からの報告に加え、協会が独自に覚知する報道・クレーム等のルートもある）"}, {"q": "新制度で登録数が劇的に増えることが想定されている理由は？", "a": "自動登録を基本とするため"}]}, {"title": "第3章 マネジメントインタビュー", "cards": [{"q": "マネジメントインタビューはM&Aプロセスのどの段階で実施されるか？（2つの段階）", "a": "①初期フェーズでの全体把握のインタビュー（提携仲介契約の締結前後）、②作業フェーズでの個別事項のインタビュー（スキーム検討・株価算定・概要書作成段階）"}, {"q": "初期フェーズのインタビューで確認すべき6つの項目は？", "a": "①個別相談（会社の状況・譲渡の意思確認）、②譲渡動機（重要度合いの把握）、③全体把握（企業情報・企業概要の大会合せ）、④企業把握（ヒトモノカネ・事業の中身の把握）、⑤企業概要書（ビジネスモデル比較）、⑥候補先選定（シナジーの検討）"}, {"q": "作業フェーズのインタビューでは何を確認するか？", "a": "スキーム検討・株価算定・概要書作成に必要な個別具体的な事項"}, {"q": "譲受け希望企業によるインタビューはM&Aプロセスのどの段階で行われるか？", "a": "企業概要書（詳細）検討以降の段階と、買収人によるインタビュー（DD前後）"}, {"q": "「定量情報」と「定性情報」の違いを簡潔に述べよ", "a": "定量情報＝数値化できる情報、定性情報＝数値化できない情報"}, {"q": "定性情報を「設計図」「運転マニュアル」に例えると、具体的にどのような項目が該当するか？", "a": "企業理念、経営方針、社長の性格、会社の沿革"}, {"q": "定量情報のうち「実際の運営」にあたる項目は何か？", "a": "社員教育、営業手法、設備投資額、生産・原価管理"}, {"q": "定量情報のうち「結果＝現実」にあたる項目は何か？", "a": "決算数値、取引先別実績、社員構成、保有設備"}, {"q": "マネジメントインタビューの目的を定性情報の観点から述べよ", "a": "「その結果＝定量情報＝資料の内容」に至った理由、すなわち定性情報を入手すること"}, {"q": "マネジメントインタビュー実施時の注意点①「決算書等を含め、資料をよく分析してから行う」理由は？", "a": "「その結果＝定量情報＝資料の内容」に至った理由（＝定性情報）を入手するため。また、経営者が必ずしも自社の細かい数値を全て把握しているわけではないため"}, {"q": "マネジメントインタビュー実施時の注意点②「詰問でも尋問でもない」とはどういう意味か？", "a": "粗探しのために行うのではなく、経営者とのコミュニケーション＝信頼関係の構築作業であり、相手に対する敬意と評価を伝える作業。売り手は人生の成功者である"}, {"q": "マネジメントインタビュー実施時の注意点③「仮説は必要だが、それに拘らない」とはどういう意味か？", "a": "自分の考えを押し付けないこと。ステレオタイプな思い込みは禁物で、中小企業に「標準」は無い。想像力を「前向き」に発揮し、「弱み」こそがシナジーを探す入口となる"}, {"q": "マネジメントインタビューにおける会計の視点で「売上・在庫・売掛金の計上基準、返品の有無」の確認が必須な理由は？", "a": "売上計上のタイミング（契約時・出荷時・引渡時・検収時）により数値が異なり、在庫の実態や評価方法が企業価値に直結するため"}, {"q": "売上計上基準の確認で注意すべきポイントは？", "a": "どの段階で売上計上しているのか（契約時、出荷時、引渡時、検収時）、責任はいつ移転するか、物流手配は誰がするか"}, {"q": "「検収基準」と一言で言っても確認すべき点は何か？", "a": "自社工場内試運転 VS 客先取付後試運転、納期と計上サイトと資金負担"}, {"q": "輸出の場合の売上計上で確認すべき2点は？", "a": "①いつが売上か（仕向地まで？船荷証券で？）、②インコタームズは何か"}, {"q": "「売掛金なのに実は在庫」のケースとはどのような場合か？", "a": "百貨店が主要取引先のアパレル等は委託販売（委託販売・消化仕入れ）であり、売掛金に見えて実質的には在庫の場合がある"}, {"q": "「原事企画販売業」は決算時に何に注意すべきか？", "a": "月次試算表・法人概況報告書の入手は必須"}, {"q": "在庫の評価方法に関して確認すべきポイントは？", "a": "「売価還元法」だけでなく、アパレル認定でも完全受注生産ではなく原価計算が未整備の場合がある。また自動車販売業の「在庫」と「展示車（固定資産）」は、在庫→固定資産→減価償却計上となり利益の解釈が変わる"}, {"q": "注意を要する勘定科目の例「前受金」とは？", "a": "設備設計・製造業・予備校・工事等で見られ、売上基準と密接に関連する科目"}, {"q": "注意を要する勘定科目の例「為替差損益」とは？", "a": "輸出入取引がある場合、為替変動の原価への反映方法やデリバティブ取引の有無、半期決算の外貨建金額の変動を確認する必要がある"}, {"q": "注意を要する勘定科目の例「前払金・仮払金」とは？", "a": "飲食業・介護業等で見られ、特にパート社員の給与が現金払いでないかを確認する"}, {"q": "スムーズにマネジメントインタビューするために心得るべきプロセスは？", "a": "資料→インタビュー→仮説構築→インタビューで検証・修正の反復作業であると心得る"}, {"q": "エビデンス主義に関する注意点は？", "a": "可能な限りエビデンス主義だが、顧客に過度に資料収集・作成の負担をかけない"}, {"q": "業界・業種の事前調査で行うべきことは？", "a": "業界・業種の最近のニュースを調べ、独特の慣習等の有無を調べ、過去の同業種の案件のデータを参照する"}, {"q": "マネジメントインタビューに臨む上での自己認識として重要なことは？", "a": "自身の理解力の限界を知ること。M&Aのプロであっても業界のプロではない。「生兵法は怪我のもと」"}, {"q": "個別事項インタビューで最初に行うべきことは？", "a": "先ずインタビューシートの記載内容を確認し、定性情報（数値化出来ない情報）として重要な事項を重点的に確認する"}, {"q": "個別事項インタビュー項目①「社長（オーナー）の属性」で確認すべき3点は？", "a": "①経営理念・企業文化、②譲渡理由（これが一番大切！）、③希望価格の確認"}, {"q": "個別事項インタビュー項目②「組織体制とキーパーソンの確認」で確認すべき3点は？", "a": "①営業が強いか弱いか、②キーパーソンはどのような人物か、③M&A後離職するような可能性はあるか"}, {"q": "個別事項インタビュー項目③「株主・株券の確認」で確認すべき4点は？", "a": "①株券発行会社か（株券発行会社となっていても発行していない場合が多い）、②現物はあるか（発行してあるが現物が紛失している時もあり要注意）、③名義株主はいないか（名義株主であれば名義株主の確認書を取るなどの処理が必要）、④所在不明株主はいないか（原則譲渡対象とはできない。会社法に則り裁判所の許可を得て売却等の処理が必要）"}, {"q": "個別事項インタビュー項目④「人事・労務の確認」で確認すべき5点は？", "a": "①就業規則・賃金規定・退職金規定等は完備されているか（退職金規程がない中小企業も多い）、②給与・退職金等の支払いは適正か（未払い残業代が論点になることが多い）、③組織として機能しているか（キーマンに求心力・信頼感があるか）、④労働組合はあるか、⑤労使紛争はないか"}, {"q": "個別事項インタビュー項目⑤「簿外債務・偶発債務の確認」で確認すべき3点は？", "a": "①会社で保証していないか、②訴訟を抱えていないか、③税務リスクはないか"}, {"q": "個別事項インタビュー項目⑥「主要取引先との関係確認」で確認すべき4点は？", "a": "①誰が取引先と繋がっているのか、②M&A後取引解消とならないか、③チェンジオブコントロール条項はないか、④どの取引先との取引が収益が高いのか"}, {"q": "個別事項インタビュー項目⑦「業界規模、成長性の確認」で確認すべき3点は？", "a": "①許認可業種か、②マーケット規模はどの程度か、③今後の成長はどうか"}, {"q": "個別事項インタビュー項目⑧「競合、業界ポジションの確認」で確認すべき4点は？", "a": "①競合先や競合商品は何か、②競合と比べての強み・弱みは何か、③業界的にはどのポジションか、④参入障壁はどの程度か"}, {"q": "「チェンジオブコントロール条項」とは何か？", "a": "企業の支配権（経営権）が変わった場合に、取引先が契約を解除できる等の条項のこと。M&A後に主要取引先との契約が解消されるリスクに直結する"}]}, {"title": "第4章 案件化と概要書作成", "cards": [{"q": "「案件化」とは何か？", "a": "案件化とは「会社を売れるかたちにする」ことであり、譲渡企業の実態把握を行い、買手候補とすぐに商談が開始できる状態になったことをいう"}, {"q": "案件化を構成する3つの成果物は？", "a": "①企業概要書、②企業評価書、③ノンネームシート"}, {"q": "案件化で把握すべき企業の実態は4つの要素に分類される。それぞれ何か？", "a": "①ビジネスモデル、②組織体系、③設備状況、④財務状況"}, {"q": "案件を受託した以上、高い品質で案件化を行う必要がある理由は？", "a": "売れそうな案件か否かに関わらず高い品質で案件化を行うことが、結果的には成約率の飛躍的な向上につながり、売り手にとってもベストな形となるため"}, {"q": "「企業概要書」とは何か？", "a": "譲渡企業の内容を30〜40ページに要約した提案書であり、買手候補がM&Aの検討を進めるかどうかを決定する際に参考とするもの。Information Memorandum（IM）とも呼ばれる"}, {"q": "企業概要書がM&Aアドバイザーの付加価値となる理由は？", "a": "買手候補に譲渡企業の現況を正確に理解してもらうと同時に、譲渡企業自身が把握していない魅力をM&Aアドバイザーが見出し資料に反映させることが付加価値となり、シナジーのある企業マッチングに繋がるため"}, {"q": "企業概要書を作成する際に参照すべき3つの資料は？", "a": "①ファクトブック、②DB報告書、③信用調査レポート"}, {"q": "企業概要書作成時の4つのポイントは？", "a": "①適切な資料開示の依頼、②インタビューと現場見学から読み解く、③買手候補が気にするポイント、④視覚的にわかりやすい見せ方"}, {"q": "企業概要書作成における情報収集の流れは？", "a": "初期的開示資料（販売先・業界）→追加開示資料（組織・業績・設備・株主）→インタビュー・現場見学（エリア）→情報の取捨選択と構成を考える→適切な写真・図・グラフを用いる→企業概要書が完成"}, {"q": "買手候補が気にするポイント（業種別固有の論点）：調剤薬局の場合は？", "a": "①3年分の店舗別月計表、②処方元医療機関の情報"}, {"q": "買手候補が気にするポイント（業種別固有の論点）：ITソフトウェアの場合は？", "a": "①スキルシート・プロジェクト実績、②オフショア・ニアショア企業の情報、③社会保険の加入状況"}, {"q": "買手候補が気にするポイント（業種別固有の論点）：土木・建設の場合は？", "a": "①工事経歴書、②有資格者情報、③累計建築戸数・客単価"}, {"q": "企業概要書の基本構成（目次）を6つのセクションで述べよ", "a": "Section 1：エグゼクティブサマリー、Section 2：事業内訳、Section 3：事業拠点・不動産・設備、Section 4：組織・従業員・許認可、Section 5：財務情報、Section 6：関連会社"}, {"q": "企業概要書の「Section 1 エグゼクティブサマリー」が最重要とされる理由は？", "a": "案件の第一印象を決める最重要セクションであり、Section 2以降の情報を網羅的かつポイントを絞って記載し、各スライドにワンラインメッセージをつける。実際の提案ではエグゼクティブサマリーの説明が中心になり、15分以内に全体像と魅力が伝わる構成にする"}, {"q": "エグゼクティブサマリーに含まれるM&A検討時の必須要素8項目は？", "a": "①基本情報、②事業概要・製品サンプル、③事業フロー、④セグメント情報、⑤特徴、⑥財務ハイライト、⑦業界情報、⑧希望条件"}, {"q": "企業概要書の「ビジネスモデル」に該当する把握項目は？", "a": "事業フロー・サービス／製品・内製化／外注化・強み／弱みなど"}, {"q": "企業概要書の「ヒト（組織体系）」に該当する把握項目は？", "a": "株主・組織・キーマン・給与体系・退職金など"}, {"q": "企業概要書の「モノ（設備状況）」に該当する把握項目は？", "a": "事業所・工場・機械設備・老朽度合い・利便性など"}, {"q": "企業概要書の「カネ（財務状況）」に該当する把握項目は？", "a": "売上・利益・固定状況・借入状況・簿外の負債・負債の存在など"}, {"q": "まとめ①：概要書の目的は何か？", "a": "概要書は買手候補の検討を進める為に必要と思われる内容を纏めたものである"}, {"q": "まとめ②：4大要素を意識する重要性は？", "a": "ビジネスモデル・組織体系・設備状況・財務状況の4大要素を意識して、情報の過不足なく作成しなければならない"}, {"q": "まとめ③：概要書の本質的な役割は何か？", "a": "概要書は譲渡企業の魅力を伝える唯一の手段である"}, {"q": "まとめ④：質の高い概要書を作成するために最も重要なことは？", "a": "質の高い概要書を作成できるかは、マネジメントインタビューの出来に左右される"}, {"q": "まとめ⑤：概要書に入れてはならない内容は？", "a": "自分が説明できない内容を概要書に入れてはならない"}]}, {"title": "第5章 マッチング", "cards": [{"q": "マッチングの基礎知識として、買収は景気の好不況に応じてどのような方向に動くか？", "a": "買収は「足りない方向」に動く"}, {"q": "不況時の買収はどの方向に動くか？", "a": "販売が少ないため、販売先をとりこむ（垂直統合）。また、販売先を持つ同業をとりにいく（水平統合）"}, {"q": "好況時の買収はどの方向に動くか？", "a": "供給が少ないため、仕入先をとりこむ（垂直統合）"}, {"q": "「垂直統合」とは何か？", "a": "サプライチェーン上の川上（仕入先）または川下（販売先）の企業を取り込む方向のM&A"}, {"q": "「水平統合」とは何か？", "a": "同業者（競合）を取り込む方向のM&A。販売先を持つ同業を取得してスケールメリットを追求する"}, {"q": "「隣接への展開」とはどのような概念か？", "a": "同じ業界A内の競合を水平に取り込むだけでなく、隣接する業界Bの同業に水平・隣接で展開すること"}, {"q": "隣接への展開の例として「家電量販店」が挙げられる理由は？", "a": "ネットビジネスの隆盛によりビジネスモデルが陳腐化しているため、隣接業界への展開ニーズがある"}, {"q": "隣接への展開の例として「医療・自動車業界」が挙げられる理由は？", "a": "安定・参入障壁が高く、新規で取引を開設するのは困難であるため、M&Aで取り込む動機が強い"}, {"q": "マッチング候補先選定における「業界再編型」の戦略は何か？", "a": "「スケールメリットを追求」する戦略。仕入コスト・人件費・取引先等共通化によるコストダウンを狙う"}, {"q": "「業界再編型」に該当する業種の例を4つ挙げよ", "a": "薬局・ドラッグストア・印刷・人材派遣等"}, {"q": "業界再編型のマッチングの組合せパターン2つは？", "a": "①同業種×同地域、②同業種×異地域"}, {"q": "マッチング候補先選定における「再成長型」の戦略は何か？", "a": "「ビジネスモデルの再構築」を目指す戦略。成熟企業・業界は本業だけでは停滞感があり、新規事業を取り込むことで再び成長局面へ向かう"}, {"q": "再成長型のマッチングの組合せパターン2つは？", "a": "①異業種×同地域、②異業種×異地域"}, {"q": "事例「同業種×同地域①」：木材卸A社（東京・年商3500億円）×木材卸B社（東京・年商50億円・銘木）のシナジーは？", "a": "①営業拠点統合、②スケールメリット、③商材補完"}, {"q": "事例「同業種×同地域②」：ビジネスホテルC社（東京・年商1000億円）×ビジネスホテルD社（北海道・3店事業・年商10億円）のシナジーは？", "a": "①域内シェア拡大、②運営ノウハウ共有化"}, {"q": "事例「同業種×異地域」：アパレルE社（群馬県・年商100億円）×アパレルF社（東京都・年商20億円）のシナジーは？", "a": "①ブランド展開、②一部内製化"}, {"q": "事例「異業種×同地域①」：設備工事（ガス）G社（東京都・年商300億円）×電気工事H社（神奈川県・年商10億円）のシナジーは？", "a": "①隣接工種強化、②有力顧客獲得"}, {"q": "事例「異業種×異地域①」：住宅設備製造O社（愛知県・年商30億円）×製缶板金P社（群馬県・年商2億円）のシナジーは？", "a": "①製造部門の内製化、②納期・品質の向上、③BCP対策"}, {"q": "事例「異業種×異地域②」：楽器販売Q社（千葉県・年商150億円）×印刷R社（京都府・年商2億円）のシナジーは？", "a": "①内製化による品質・納期向上、②地域面の親和性"}, {"q": "マッチングにおける4つの組合せの軸は何か？", "a": "①同業種×同地域、②同業種×異地域、③異業種×同地域、④異業種×異地域"}, {"q": "業界再編型と再成長型の違いを一言で述べよ", "a": "業界再編型は「同業種の統合によるスケール追求」、再成長型は「異業種の取込みによるビジネスモデル再構築」"}]}, {"title": "第6章 M&Aと法務実務", "cards": [{"q": "会社分割の2つの型は？", "a": "①分社型（新設会社に事業を移転し、その株式を譲受け企業に渡す）、②分割型（残す事業を新設会社に移し、承継事業が残った譲渡企業の株式をオーナーから譲受け企業に渡す）"}, {"q": "会社分割において現在トレンドとなっているのはどちらの型か？", "a": "分割型"}, {"q": "分社型の会社分割の仕組みを述べよ", "a": "譲渡企業から事業（従業員・資産（負債）・契約包括承継）を新設会社に移し、新設会社の株式を譲受け企業に渡す"}, {"q": "分割型の会社分割の仕組みを述べよ", "a": "①残す事業を新設会社に移し、②承継事業が残った譲渡企業の株式をオーナーから譲受け企業に渡す"}, {"q": "基本合意とは何か？", "a": "M&Aを検討している当事者が、最終契約を締結する前段階（特にデューデリジェンス実施前）において、当該時点における当事者の合意事項を確認し、いくつかの基本事項について合意する目的で締結する契約。Letter of Intent（LOI）やMemorandum of Understanding（MOU）とも呼ばれる"}, {"q": "基本合意の内容（主要条項）を5つ挙げよ", "a": "①買収に関する諸条件の確認、②買収監査への協力義務、③独占交渉権の付与、④秘密保持義務の設定、⑤スケジューリングの確認"}, {"q": "基本合意における法的拘束力の特徴は？", "a": "法的拘束力の有無は案件ごとに様々である"}, {"q": "基本合意に関する関連論点を3つ挙げよ", "a": "①法的拘束力とブレイクリスク、②大幅な条件変更と契約締結上の過失、③上場企業の適時開示義務との関係（意向表明）"}, {"q": "簿外負債の発見はDDにおける何の一つか？", "a": "DDにおける超重要な調査事項の一つ"}, {"q": "簿外負債の発見で確認すべき項目を3つ挙げよ", "a": "①保証の有無、②未払残業の問題、③デリバティブの問題等"}, {"q": "簿外負債が発見された場合の影響は？", "a": "売買価格の調整や契約書への影響等がある"}, {"q": "チェンジオブコントロール条項の定義は？", "a": "対象会社が当事者となっている契約のうち、対象会社の主要株主の変更や対象会社における経営体制の重大な変更について、事前の通知・承諾、解除原因や期限の利益の喪失事由等とされている条項"}, {"q": "チェンジオブコントロール条項の趣旨・機能は？", "a": "取引の相手方当事者の支配権が移動することにより、当該当事者の信用状態や経営方針の変更が見込まれる場合に、他方当事者に契約を継続するか否か検討の機会を与えること"}, {"q": "チェンジオブコントロール条項が買収防衛策として機能するケースは？", "a": "中小企業のM&Aでは殆ど想定できない"}, {"q": "最終契約の主な構成8項目を挙げよ", "a": "①当事者・譲渡日・対象株式・譲渡価額（一株当たりの金額）、②表明保証、③譲渡日までの義務（売主・買主）、④クロージング条件、⑤譲渡後の義務（売主・買主）、⑥解除・損害賠償、⑦一般条項、⑧その他"}, {"q": "最終契約における「譲渡日までの義務」（売主・買主）の具体例を挙げよ", "a": "社内手続きの履践・善管注意義務・重大行為の禁止・従業員の異動の禁止・役員の辞任届の取りまとめ・株券不発行会社への定款変更・取引先への対応（チェンジオブコントロール条項の対応）等"}, {"q": "クロージング条件とは何か？", "a": "表明保証が真実かつ正確であること、譲渡日までの義務が遵守されたこと等が満たされていることを条件として、クロージング（決済）を実行する"}, {"q": "譲渡後の義務のうち売主の義務は？", "a": "競業避止義務・引継等"}, {"q": "譲渡後の義務のうち買主の義務は？", "a": "従業員の処遇の維持・保証債務の解除・退職慰労金の支給等"}, {"q": "契約の解除ができる場合（合意解除によらない場合）を3つ挙げよ", "a": "①相手方の契約違反又は表明保証違反、②相手方において法的な倒産手続きがなされた場合、③対象会社において法的な倒産手続きがなされた場合（買手からのみ）"}, {"q": "M&Aの実務では解除ができる時期はいつまでか？", "a": "クロージング（決済）まで。クロージング後は再売買又は損害賠償請求による"}, {"q": "解除の効力は遡及効が原則（民法545条第1項）だが、M&Aではどうか？", "a": "M&Aでは原状回復がほぼできない"}, {"q": "損害賠償の対象となるものは？", "a": "契約違反・表明保証違反・特別補償等"}, {"q": "損害賠償における上限と期間の設定は？", "a": "金額の上限と期間の制限を設ける必要がある"}, {"q": "株式・株主等の確認において、株主名簿の確認だけでは不十分な理由は？", "a": "そもそも株主名簿が無いか、要件を満たさない場合が多いため"}, {"q": "株主名簿の要件として記載すべき事項を4つ挙げよ", "a": "①株主の氏名又は名称及び住所、②株主の有する株式の数、③株式を取得した日、④株券発行会社である場合には株券の番号"}, {"q": "株主の追跡方法は？", "a": "取締役会・株主総会議事録、株券の裏面、法人税申告書別表その2、遺産分割協議書等の資料を確認し、株主変遷表を作成する"}, {"q": "株式譲渡が適正になされているか確認するポイントは？", "a": "各段階で適正になされているか（取締役会の承認、株券の交付等）を確認する。取締役会の承認がなされていても、特別利害関係人の排除がなされていないことが多い"}, {"q": "株券の紛失箇所がある場合の主要な対処法を3つ挙げよ", "a": "①株券喪失登録の制度の活用（1年経過で無効）、②株券不発行会社へ定款変更（基本2週間で可能、但し株券の善意取得を完全に防ぐことは難しい）、③株券の単純な再発行（要注意）"}, {"q": "株主名簿の名義書換手続きにおいて、譲受け人が会社に対抗するために必要なことは？", "a": "株主名簿の名義書換を行わない限り、譲受け人は株主であることを会社に対して対抗（＝主張）できない"}, {"q": "株主名簿の名義書換手続きは誰が行うのが原則か？", "a": "譲渡人と譲受け人が共同で行うのが原則"}, {"q": "例外的に譲受け人が単独で名義書換請求できる場合は？", "a": "現に株券を発行している会社の場合"}, {"q": "役員変更の目的は？", "a": "譲受け人が株主として会社の経営に参画し、意思決定に関与するために、譲受け人又は譲受け人が指名する人物を会社の役員にして経営権を握る必要がある"}, {"q": "取締役・監査役の選任機関は？", "a": "株主総会"}, {"q": "代表取締役の選任機関は？", "a": "取締役会設置会社では取締役会、取締役会非設置会社では①株主総会、②取締役の互選、③定款のいずれか"}, {"q": "役員変更に必要な書類4種類は？", "a": "①新役員を選任した書面（株主総会議事録・取締役会議事録等）、②新役員が就任したことを証する書面（就任承諾書・印鑑証明・本人確認書類等）、③旧役員が辞任したことを証する書面（辞任届等）、④新代表取締役が会社実印を登録する書面（印鑑届書）"}, {"q": "役員変更書類を法務局に提出する際の注意点は？", "a": "法務局に対して提出する書類なので、不備があると受理されず登記してもらえない。的確な処理が必要"}]}, {"title": "第7章 PMI", "cards": [{"q": "PMIとは何の略か？また何を意味するか？", "a": "Post Merger Integration（ポスト・マージャー・インテグレーション）の略。M&A成約後の統合プロセスを指す"}, {"q": "日本PMIコンサルティングのサービスは大きく2つに分かれる。それぞれ何か？", "a": "①コミュニケーションサポート、②個別課題への対応"}, {"q": "PMIサービスの流れ（3か月＋継続）を述べよ", "a": "現状分析（課題抽出）→100日プラン（企業統合）→計画実行（アクションプラン）→成果"}, {"q": "コミュニケーションサポートで関わるステークホルダーは？", "a": "譲渡企業の社長・キーパーソン・新社長（PMI支援担当）・譲受け企業の社員等。ファシリテーション・ヒアリング・プランニング・報告（定例会議）等を実施する"}, {"q": "個別課題への対応のうち「会計領域」の具体例を4つ挙げよ", "a": "①業務引継ぎ支援、②管理会計の導入、③単体決算の早期化、④連結決算/内部統制の整備"}, {"q": "個別課題への対応のうち「ビジネス領域」の具体例を4つ挙げよ", "a": "①経営ビジョンの共有、②新経営体制の整備、③業務フロー分析、④組織分析"}, {"q": "個別課題への対応のうち「共通」の具体例を4つ挙げよ", "a": "①100日プランの策定、②事業計画の策定、③KPIの設計、④経営管理資料の作成"}, {"q": "M&Aで期待通りの成果が出せるかどうかは何と相関しているか？", "a": "経験値と相関している。買収経験が増す毎に期待通りの買収効果を出せるようになる"}, {"q": "買収回数と統合成果の関係：1〜2件の場合の「期待通り」の割合は？", "a": "45%"}, {"q": "買収回数と統合成果の関係：3〜5件の場合の「期待通り」の割合は？", "a": "66%"}, {"q": "買収回数と統合成果の関係：6件以上の場合の「期待通り」の割合は？", "a": "80%"}, {"q": "M&Aが「失敗」した要因の上位5つと割合は？", "a": "①相乗効果が出なかった（44.7%）、②相手先の経営・組織体制が脆弱（36.8%）、③相手先の従業員に不満（28.9%）、④買収価格が高すぎた（23.7%）、⑤企業文化・組織風土の融合（22.8%）"}, {"q": "M&A成約前からPMIに向けた準備をしておかないとどうなるか？", "a": "ゴールを明確にしたうえでPMIに向けた準備をしておかないと、失敗する可能性が高くなる"}, {"q": "「失敗するPMI」のパターン①「自社の当たり前を強要する」とは？", "a": "主導権争いや買い手企業の\"上から目線\"でPMIを進めてしまうこと"}, {"q": "「失敗するPMI」のパターン②「投資回収への焦り」とは？", "a": "そもそもの「高値掴み」や拙速な改革・過度のマネジメントを行うこと"}, {"q": "「失敗するPMI」のパターン③「気遣いという名の放任」とは？", "a": "方針や要望の未発信/遠慮、事業に対する理解不足、「放置」というマネジメントの放棄"}, {"q": "「失敗するPMI」のパターン④「経営人材の不足」とは？", "a": "新社長候補がいない（\"一丁上がり\"の人材を派遣する×）、PMIの実務担当者を確保できない"}, {"q": "「失敗するPMI」のパターン⑤「業務引継ぎに関する約束の未締結／未履行」とは？", "a": "売手社長の役割の未変化と意見対立、業務引継ぎがいつまでも終わらない"}, {"q": "M&Aでは契約が何合目であり、残りの8合分は何か？", "a": "M&Aでは契約が2合目。残りの8合分は「企業文化の違いをすり合わせるPMI」という手間のかかる作業"}, {"q": "PMIにかかる期間は地域によってどう違うか？", "a": "日本企業で1年、アジアが2年、欧州が3年、米が5年"}, {"q": "PMIは「M&Aの後工程」であるが、スムーズなスタートのために何が必要か？", "a": "Day1までにその後のプロセスを見据えた準備をしておく必要がある"}, {"q": "PMI後工程の具体的なプロセス（Day1以降6か月）を順に述べよ", "a": "成約式→M&A条件の履行→ディスクローズ→現状分析→プロジェクト組成→経営方針発表→事業計画策定→KPI設定→モニタリング体制→源泉決算＆内部統制→フォローアップ"}, {"q": "PMIは「信頼関係構築のプロセス」であるが、いつから始まっているか？", "a": "TOP面談から始まっている"}, {"q": "PMI検討時期と統合成果の関係：「期待を上回る」成果を出した企業は、いつからPMIを検討していたか？", "a": "基本合意より前が36%、DD中が29%で、合計65%が基本合意〜DD中に検討開始している"}, {"q": "PMI検討時期と統合成果の関係：「かなり期待を下回る」企業のPMI検討開始時期の特徴は？", "a": "基本合意より前17%、DD中17%と早期検討が少なく、DD後から最終契約まで33%、検討無し33%と遅い・未検討が多い"}, {"q": "PMIは「守ってから攻める」がセオリーとされる理由は？", "a": "シナジー効果を求めるあまり、M&A直後から無理に仕事のやり方を変えたり、コストカットを推進するやり方は間違い。M&A直後は会社と自分の将来に「不安」を抱えており、新しい経営者は「お手並み拝見」と眺められており、リクエストが通じるような十分な信頼関係を築けていない"}, {"q": "PMIの課題を3段階に区分すると何か？", "a": "①Physical Issues（実務的な課題）、②Organizational Issues（組織的な課題）、③Emotional Issues（感情的な課題）"}, {"q": "PMIの3段階の課題における4つの領域は？", "a": "第1領域：ハード×Physical（感情の振れ幅小）、第2領域：ソフト×Organizational、第3領域：ソフト×Emotional（感情の振れ幅大）、第4領域：ハード×Emotional。クイックヒットは第1・第4領域の間に位置する"}, {"q": "「クイックヒット」とは何か？", "a": "すぐにわかる変化のこと。早期に「M&Aによるポジティブな変化」を見せることでモチベーション向上を図る"}, {"q": "クイックヒットの具体例を8つ挙げよ", "a": "①経営方針の発表、②オフィスの移転、③PCの一新、④コピー機の入れ替え、⑤メールアドレスの全社員付与、⑥名刺のデザイン替え、⑦飲食機会の設定・個別面談、⑧「社長賞」の創設と表彰"}, {"q": "クイックヒットが重要な理由は？", "a": "対象会社の従業員はM&Aによって自分の仕事や生活にネガティブな影響が出ないかどうか常にアンテナを立てて情報をキャッチしようとしているため、早期にポジティブな変化を見せないと「このM&Aはしない方がよかったのではないか」という不満が蓄積する"}]}, {"title": "第8章 トラブル防止対策", "cards": [{"q": "受託折衝時のポイントを3つ挙げよ", "a": "①前向きな表現・平易な言葉を用いる、②話を聞いて都度整理する、③会社のことを本気で考え正直に提言する"}, {"q": "「ブレイク」とは何か？", "a": "商談（ディール）が壊れること"}, {"q": "ブレイクの要因は何か？", "a": "資本提携に関わるポイントや論点を、アドバイザーが事前に把握し、お客様と適切な協議や解決及び打開策を見出さないまま商談を進めたため発生する"}, {"q": "ブレイクは事前に防ぐことができるか？", "a": "受託前の協議や案件化の作業によって事前に防ぐことができる。防げないのは天変地異・急激な業績悪化・意思決定者の死去など突発的な事象によるもの"}, {"q": "ステージごとのトラブル要因：「受託前」の代表的トラブルポイントとダメージは？", "a": "トラブル：主要株主の反対（親族）・譲渡不可能な対象の相談。ダメージ：時間"}, {"q": "ステージごとのトラブル要因：「案件化」の代表的トラブルポイントとダメージは？", "a": "トラブル：必要情報入手困難・資料紛失・重大な法令違反等。ダメージ：時間＋費用"}, {"q": "ステージごとのトラブル要因：「マッチング」の代表的トラブルポイントとダメージは？", "a": "トラブル：条件に合致する候補先現れず。ダメージ：時間＋費用。トラブルの結果として進行中の商談が破談になる"}, {"q": "ステージごとのトラブル要因：「買収監査（DD）」の代表的トラブルポイントとダメージは？", "a": "トラブル：基本合意を揺るがす問題が発覚・売手譲渡意志の減退・買手役員会否決。ダメージ：時間＋費用＋精神的苦痛"}, {"q": "ステージごとのトラブル要因：「PMI」の代表的トラブルポイントとダメージは？", "a": "トラブル：重大な隠し事の発覚・元オーナーの引退拒否。ダメージ：時間＋費用＋精神的苦痛＋従業員混乱"}, {"q": "進行中の商談におけるブレイク要因：「トップ面談・現地視察」フェーズでは？", "a": "想定外の情報がトップ面談の場で発覚、譲渡企業と譲受け企業が期待値と異なった"}, {"q": "進行中の商談におけるブレイク要因：「条件交渉・調整」フェーズでは？", "a": "譲受けに関する諸条件が一致せず、条件交渉・調整に時間がかかり譲渡意思・買収意思減退"}, {"q": "進行中の商談におけるブレイク要因：「基本合意契約書の締結」フェーズでは？", "a": "本件を開示した株主からの反対"}, {"q": "進行中の商談におけるブレイク要因：「DD（買収監査）」フェーズでは？", "a": "価格調整事項や大きな論点など基本合意を揺るがす問題が発覚、売手譲渡意思の減退"}, {"q": "進行中の商談におけるブレイク要因：「最終条件の交渉・調整」フェーズでは？", "a": "重大な隠し事の発覚、買手役員会否決"}, {"q": "進行中の商談におけるブレイク要因：「最終契約の締結・デリバリー・決済」フェーズでは？", "a": "開示したキーマンからの反対、譲渡企業社内に後継者の出現"}]}, {"title": "第9章 企業評価概論", "cards": [{"q": "上場会社のM&A実務における企業評価の主流は？", "a": "市場株価平均法を軸に、DCF法と類似会社比準法での検討が主流"}, {"q": "非上場会社（中堅・中小企業）のM&A実務における企業評価の主流は？", "a": "時価純資産法に一定の営業権を加味する方法が主流"}, {"q": "企業価値評価の3つのアプローチは？", "a": "①コストアプローチ（純資産法）、②インカムアプローチ（収益法）、③マーケットアプローチ（市場法）"}, {"q": "コストアプローチの概要は？", "a": "企業の純資産に着目した評価手法。帳簿上の純資産を時価に修正して算出する"}, {"q": "コストアプローチの代表的な手法を2つ挙げよ", "a": "①簿価純資産法、②時価純資産法"}, {"q": "時価純資産法の基本的な考え方は？", "a": "B/S上の資産・負債を時価に修正し、時価ベースの純資産を株式価値とする"}, {"q": "インカムアプローチの概要は？", "a": "企業の収益力に着目した評価手法"}, {"q": "インカムアプローチの代表的な手法を3つ挙げよ", "a": "①収益還元法（企業の会計上の利益に着目する方法）、②配当還元法（企業が生み出す配当に着目する方法）、③DCF法（企業が生み出すキャッシュフローに着目する方法）"}, {"q": "インカムアプローチの基本算式（毎年一定の収益）は？", "a": "対象会社の事業価値＝対象事業の収益等÷対象事業の期待利回り"}, {"q": "インカムアプローチの応用算式（毎年一定の収益＋一定率の成長が見込める場合）は？", "a": "対象会社の価値＝対象事業の収益等÷（対象事業の期待利回り－期待成長率）"}, {"q": "マーケットアプローチの概要は？", "a": "市場での取引価格に着目した評価手法"}, {"q": "マーケットアプローチの代表的な手法を3つ挙げよ", "a": "①市場株価法、②類似会社比準法（マルチプル法）、③類似取引比較法"}, {"q": "類似会社比準法（PER法）のPERの算式は？", "a": "PER（Price Earnings Ratio＝株価収益率）＝株式時価総額÷当期利益（予想）"}, {"q": "PER法の計算手順は？", "a": "①複数の類似上場会社のPERを計算しその平均値を計算、②対象会社の当期利益（予想）に類似会社平均のPERを乗じ、対象会社の株式価値を計算"}, {"q": "EV/EBITDA倍率法とは？", "a": "EV（Enterprise Value＝事業価値）をEBITDA（税引前利益＋支払利息＋減価償却費）で割った倍率を使う評価法"}, {"q": "「事業価値」とは何か？", "a": "対象会社のBS（時価ベース）における本業の価値（EV）のこと"}, {"q": "企業価値の内訳は？", "a": "事業価値（EV）＋余剰資産"}, {"q": "株式価値の算出方法は？", "a": "事業価値（＋）余剰資産（▲）有利子負債＝株式価値"}, {"q": "余剰資産の例を3つ挙げよ", "a": "必要水準を超える預金・事業目的以外の投資有価証券・遊休不動産等"}, {"q": "有利子負債の例を3つ挙げよ", "a": "社債・借入金・リース債務・退職給付債務等"}, {"q": "事業価値・企業価値・株式価値の違いを正確に理解する重要性は？", "a": "POINT：事業価値・企業価値・株式価値の意味の違いを正確に理解する必要がある"}, {"q": "企業価値の帰属先は？", "a": "債権者に帰属する部分（有利子負債）と株主に帰属する部分（株式価値）に分かれる"}, {"q": "DCF法の基本算式は？", "a": "FCF（将来CF）÷割引率（投資家の期待利回り）＝事業価値"}, {"q": "DCF法から株式価値を算出する流れは？", "a": "事業価値を算出→余剰資産を加算→有利子負債を控除→株式価値"}, {"q": "WACC（Weighted Average Cost of Capital）とは何か？", "a": "加重平均資本コスト。株主の要求利回りである株主資本コストと、債権者の要求利回りである他人資本コストの加重平均値"}, {"q": "WACCの算式は？", "a": "自己資本コスト×（自己資本時価÷（自己資本時価＋他人資本時価））＋他人資本コスト×（1-実効税率）×（他人資本時価÷（自己資本時価＋他人資本時価））"}, {"q": "自己資本コストの算定方法は？", "a": "CAPM理論（Capital Asset Pricing Model）で算定することが一般的。リスクフリーレート＋株式投資リスクプレミアム×β"}, {"q": "他人資本コストの算定方法は？", "a": "簡便的には借入金の金利であるが、厳密には現状の財務状況に対応する格付け等に応じた金利などを用いる"}, {"q": "DCF法の長所は？", "a": "将来の収益性を加味できる。最も理論的"}, {"q": "DCF法の短所を4つ挙げよ", "a": "①事業計画の見積もりに主観性が入る、②割引率の算出にあたってのパラメータに絶対的基準値がない（リスクフリーレート・株式投資リスクプレミアム・β）、③成長率の考え方に幅がある、④割引率や成長率が少しズレるだけで評価額が大きく変動する"}, {"q": "非上場のオーナー企業をDCF法で評価するときの論点を7つ挙げよ", "a": "①事業計画はあるか、②経営から手を引く売り手が作った計画が意味あるか、③βは何を用いるか、④最適資本構成はどう考えるか、⑤担保や社長の個人保証を前提にした他人資本コストでよいのか、⑥非上場であるリスクをどう考慮するか、⑦小規模であるリスクをどう考慮するか"}, {"q": "プレミアムとは何か？", "a": "上場会社が買収対象となる場合、その市場株価の2〜3割程度の価格上乗せがつけられること。経営権獲得の対価と言われる"}, {"q": "PERやEBITDAにはプレミアムが考慮されていないため、M&A価格としてはどうすべきか？", "a": "これにプレミアムを考慮する必要がある"}, {"q": "ディスカウントとは何か？", "a": "非上場会社が買収対象となる場合、PERやEBITDA倍率による株価から2〜3割程度のディスカウントが実施されること"}, {"q": "ディスカウントの根拠は？", "a": "株式の流動性の欠如などがあげられる"}, {"q": "事業計画年度以降の価値を何というか？", "a": "ターミナルバリュー（TV、残存価値）"}, {"q": "ターミナルバリューの算出方法を2つ挙げよ", "a": "①永久成長モデル（最終年度のFCFが毎年一定率ずつ成長すると仮定。例：6×(1+1%)÷(10%-1%)＝67.3）、②マルチプルモデル（最終年度のEBITDA×類似会社のEBITDA倍率で算出）"}, {"q": "中小企業M&Aにおいて「年買法（年倍法）」とは何か？", "a": "時価純資産に営業権（のれん）として利益の数年分を加算する簡便的な評価方法。実務で広く用いられる"}]}, {"title": "第10章 企業評価演習", "cards": [{"q": "時価純資産の具体的算定方法において「売掛金」の評価方法は？", "a": "回収不能である金額を控除する。具体的には①期限比較や回転期間分析による回収不能額の有無を推定しヒアリング、②法人税申告書別表11を確認し貸倒引当金が個別に設定されている債権は個別対応する、③売掛金の年齢表を入手しヒアリングする"}, {"q": "時価純資産の具体的算定方法において「棚卸資産」の評価方法は？", "a": "販売により回収不能額を控除する。具体的には①直近の実地棚卸結果との明細と突合し品目ごとの実態を確認してヒアリング、②評価基準と実際の方法を確認する、③過去の廃棄状況を確認する（製品の変動を確認する）、④棚卸資産の受払記録を入手しヒアリングする"}, {"q": "時価純資産の具体的算定方法において「有形固定資産（土地以外）」の評価方法は？", "a": "帳簿上の減正簿価（普通償却限度額の範囲）に修正する。①潜在性のないものがあれば全額控除する、②遊休資産があれば時価評価を行う、③減損会計の対象となる場合があれば全額控除する。必要資料は減価償却明細書と不動産登記簿本"}, {"q": "有形固定資産（土地以外）の減額修正のケースとは？", "a": "減価償却不足がある場合は不足額を減額する（例：期末簿価100→修正額△79→再計算後期末簿価21）"}, {"q": "有形固定資産（土地以外）の増額修正のケースとは？", "a": "減価償却超過がある場合は超過額を加算する（例：期末簿価100→修正額+21→再計算後期末簿価121）。特別償却や圧縮記帳がある場合に発生する"}, {"q": "時価純資産の具体的算定方法において「土地」の評価方法は？", "a": "路線価（相続税評価方式）により評価を行う。不動産登記簿を入手し、上記の所有権が対象会社になっていることを確認する"}, {"q": "時価純資産の具体的算定方法において「電話加入権」の評価方法は？", "a": "通常はゼロ円評価とする"}, {"q": "時価純資産の具体的算定方法において「有価証券」の評価方法は？", "a": "時価のある有価証券の評価は評価時点の時価で行う。時価のない有価証券の評価は投資先の直近期の1株あたり純資産を時価とし比較して検討する。子会社であった場合は対象会社との連結財務諸表を作成する"}, {"q": "時価純資産の具体的算定方法において「保険契約」の評価方法は？", "a": "時価（解約返戻金）で評価を行う。評価基準日時点の解約返戻金を入手し当該金額で評価する"}, {"q": "時価純資産の具体的算定方法において「敷金保証金」の評価方法は？", "a": "回収不能である金額を控除する。①解約元入手し整理計算・精算時に返還されないものが判明した場合は計上として控除する、②簿外に原状回復費用を見積もる場合は残額を控除する"}, {"q": "時価純資産における負債側の評価で注意すべき「簿外債務」の例を5つ挙げよ", "a": "①未払残業代、②退職給付債務（退職金の積立不足）、③訴訟関連の偶発債務、④保証債務、⑤税務リスク（追徴課税の可能性）"}, {"q": "営業権（のれん）の算定方法は？", "a": "実態収益力（修正後の経常利益等）を基に数年分を評価する。一般的に2〜5年分の利益を営業権として加算する"}, {"q": "中小企業M&Aにおける株式価値の簡便算式は？", "a": "時価純資産＋営業権（実態利益×年数）＝株式価値"}]}, {"title": "第11章 M&A会計・税務・組織再編", "cards": [{"q": "M&Aの主な手法を「株主の移動」「事業の移動」「資本取引」に分類した場合、それぞれの手法は？", "a": "株主の移動：株式譲渡・株式交換・株式交付・株式移転。事業の移動：事業譲渡・合併・会社分割。資本取引：現物出資・現物分配"}, {"q": "上記のうち、株式譲渡及び事業譲渡並びに株式交付を除く6つの手法には何の規定が設けられているか？", "a": "組織再編税制の規定"}, {"q": "株式交換とは何か？", "a": "A社がB社の株式を全て取得し、B社をA社の完全子会社とする手法。B社株主にはA社株式が交付される"}, {"q": "株式交換のメリットを3つ挙げよ", "a": "①完全子会社とするための手法として利用できる、②A社とB社が別法人として運営が可能、③強制買取が可能であるためA社株主が多い場合は有効"}, {"q": "株式交換のデメリットを3つ挙げよ", "a": "①対価を株式とする場合は再編後のB社株主構成に留意、②手続きが株式譲渡と比べ煩雑、③簿外債務を間接的に引き継がざるを得ない"}, {"q": "株式移転とは何か？", "a": "A社とB社の上にHD（ホールディングス）を新設し、A社・B社ともにHDの完全子会社とする手法"}, {"q": "株式移転のメリットを3つ挙げよ", "a": "①A社とB社が別法人として運営が可能、②買収イメージが少ない、③再編後HDでの他企業の買収がしやすい"}, {"q": "株式移転のデメリットを3つ挙げよ", "a": "①HDへの決裁確認が増える、②傘下の企業同士の連携がしにくい、③簿外債務を間接的に引き継がざるを得ない"}, {"q": "事業譲渡とは何か？", "a": "会社の事業の全部または一部を他の会社に譲渡する手法。資産・負債・契約等を個別に移転する"}, {"q": "事業譲渡のメリットを3つ挙げよ", "a": "①取得したい資産・事業を選択できる、②簿外債務を引き継がない、③のれんの税務上の償却（損金算入）が可能"}, {"q": "事業譲渡のデメリットを3つ挙げよ", "a": "①契約・許認可の再取得が必要、②従業員の個別同意が必要、③消費税や不動産取得税等の税コストが発生"}, {"q": "合併とは何か？", "a": "2つ以上の会社が1つの会社に統合する手法。吸収合併と新設合併がある"}, {"q": "会社分割の4つの類型は？", "a": "①分社型新設分割、②分割型新設分割、③分社型吸収分割、④分割型吸収分割"}, {"q": "分社型新設分割とは？", "a": "A社が乙事業部を新設会社（乙社）に移し、乙社株式を対価としてA社に交付する"}, {"q": "分割型新設分割とは？", "a": "A社が乙事業部を新設会社（乙社）に移し、A社は譲渡対価として乙社株式の交付を受け、剰余金の配当として乙社株式をA社の株主Xに交付する"}, {"q": "M&Aにおける「のれん」とは何か？", "a": "買収価額と被取得企業の時価純資産との差額。被取得企業の超過収益力やブランド価値等を表す"}, {"q": "会計上ののれんの償却期間は？", "a": "20年以内の効果が及ぶ期間にわたり定額法等で規則的に償却する"}, {"q": "税務上ののれん（資産調整勘定）が発生する取引は？", "a": "事業譲渡と非適格組織再編。株式譲渡では税務上ののれんは発生しない"}, {"q": "税務上ののれん（資産調整勘定）の償却期間は？", "a": "5年間で均等に損金算入が可能"}, {"q": "株式譲渡における売り手（個人）の税務は？", "a": "株式譲渡益に対して20.315%（所得税15.315%＋住民税5%）の申告分離課税"}, {"q": "株式譲渡における売り手（法人）の税務は？", "a": "株式譲渡益は法人税の課税対象（実効税率約30%）"}, {"q": "事業譲渡における売り手（法人）の税務は？", "a": "譲渡益は法人税の課税対象。資産の譲渡には消費税が課税される（土地を除く）"}, {"q": "事業譲渡における買い手の税務上のメリットは？", "a": "税務上ののれん（資産調整勘定）を5年間で損金算入でき、節税効果がある"}, {"q": "組織再編税制における「適格」と「非適格」の違いは？", "a": "適格：簿価で資産・負債を引き継ぐため譲渡損益が繰延べされる。非適格：時価で資産・負債を移転するため譲渡損益が認識される"}, {"q": "適格要件の3つの区分は？", "a": "①完全支配関係（100%）、②支配関係（50%超100%未満）、③共同事業"}, {"q": "法人株主の場合、M&A（株式譲渡）前に金銭配当又は自己株買いを実施するメリットは？", "a": "受取配当等益金不算入の非課税措置があるため、総合課税される個人株主の場合と異なり、株価圧縮に関して有効な手法。M&A時の株式譲渡益を減少させ節税効果を得られる形となる"}, {"q": "個人株主のM&Aにおける退職金活用のメリットは？", "a": "退職所得控除や1/2課税の適用により、株式譲渡対価の一部を退職金として受け取ることで税負担を軽減できる"}, {"q": "中小企業のM&Aにおいて事業譲渡と株式譲渡の税務上の主な違いは？", "a": "事業譲渡は法人税課税＋消費税発生だがのれん償却可能。株式譲渡は個人なら20.315%分離課税でシンプルだがのれん償却不可"}]}];

let S={ch:-1,ix:0,fl:false,md:'all',rs:{}};

function ld(){try{const s=localStorage.getItem('maq3');if(s)S.rs=JSON.parse(s)}catch(e){}}
function sv(){try{localStorage.setItem('maq3',JSON.stringify(S.rs))}catch(e){}}
function gk(c,q){return c+'.'+q}
function gr(c,q){return S.rs[gk(c,q)]||0}
function sr(c,q,v){S.rs[gk(c,q)]=v;sv()}

function gc(){
  if(S.ch===-1)return[];
  const ch=D[S.ch];
  let cs=ch.cards.map((c,i)=>({...c,i}));
  if(S.md==='w')cs=cs.filter(c=>gr(S.ch,c.i)===-1);
  if(S.md==='u')cs=cs.filter(c=>gr(S.ch,c.i)===0);
  if(S.md==='s'){cs=[...cs];for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}}
  return cs;
}

function cs(ci){const ch=D[ci];let c=0,w=0,t=ch.cards.length;ch.cards.forEach((_,qi)=>{const r=gr(ci,qi);if(r===1)c++;if(r===-1)w++});return{c,w,u:t-c-w,t}}
function as(){let c=0,w=0,t=0;D.forEach((_,ci)=>{const s=cs(ci);c+=s.c;w+=s.w;t+=s.t});return{c,w,t,u:t-c-w}}

function R(){const a=document.getElementById('app');if(S.ch===-1){rh(a)}else{rq(a)}}

function rh(a){
  const s=as();const p=s.t?Math.round(s.c/s.t*100):0;
  let h=`<div class="header"><h1>M&A SE 暗記</h1><div class="sub">全${s.t}問 ｜ 習得${s.c} ｜ 達成率${p}%</div></div>`;
  h+=`<div class="stats-bar"><span style="color:var(--correct)">${s.c}</span><div class="pw"><div class="pf" style="width:${p}%"></div></div><span style="color:var(--sub)">${s.t}</span></div>`;
  h+=`<div class="cl">`;
  D.forEach((ch,ci)=>{const s=cs(ci);const p=s.t?Math.round(s.c/s.t*100):0;
    h+=`<div class="ci" onclick="sc(${ci})"><div class="ct">${ch.title}</div><div class="cs"><span>${s.c}/${s.t}</span><div class="cb"><div class="cbf" style="width:${p}%"></div></div></div></div>`});
  h+=`</div><button class="rb" onclick="ra()">学習記録をリセット</button>`;
  a.innerHTML=h;
}

function rq(a){
  const cards=gc();const ch=D[S.ch];const s=cs(S.ch);const p=s.t?Math.round(s.c/s.t*100):0;
  let h=`<div class="header" style="padding:8px 0"><div style="display:flex;align-items:center;justify-content:space-between"><button class="mb" onclick="gh()" style="padding:4px 10px">← 戻る</button><div style="font-size:13px;font-weight:700;flex:1;text-align:center">${ch.title.replace(/第\d+章\s*/,'')}</div><div style="font-size:11px;color:var(--sub)">${s.c}/${s.t}</div></div></div>`;
  h+=`<div class="stats-bar" style="padding:4px 0"><span style="color:var(--correct);font-size:11px">${s.c}</span><div class="pw"><div class="pf" style="width:${p}%"></div></div><span style="color:var(--sub);font-size:11px">${s.t}</span></div>`;
  h+=`<div class="mt"><button class="mb ${S.md==='all'?'ac':''}" onclick="sm('all')">全て(${s.t})</button><button class="mb ${S.md==='u'?'ac':''}" onclick="sm('u')">未学習(${s.u})</button><button class="mb ${S.md==='w'?'ac':''}" onclick="sm('w')">苦手(${s.w})</button><button class="mb ${S.md==='s'?'ac':''}" onclick="sm('s')">シャッフル</button></div>`;
  if(!cards.length){h+=`<div class="em">${S.md==='w'?'苦手な問題はありません':S.md==='u'?'全問学習済みです':'問題がありません'}</div>`;a.innerHTML=h;return}
  if(S.ix>=cards.length)S.ix=0;
  const cd=cards[S.ix];
  h+=`<div class="card-wrap"><div class="card ${S.fl?'fl':''}" onclick="fp()"><div class="cf cfr"><div class="cn">${S.ix+1}/${cards.length}</div><div class="lb">QUESTION</div><div class="qt">${cd.q}</div><div class="ht">タップで解答表示</div></div><div class="cf cbk"><div class="cn">${S.ix+1}/${cards.length}</div><div class="lb">ANSWER</div><div class="an">${cd.a}</div></div></div></div>`;
  if(S.fl){h+=`<div class="acts"><button class="btn bw" onclick="jd(-1)">✕ 不正解</button><button class="btn bo" onclick="jd(0)">△ 微妙</button><button class="btn bc" onclick="jd(1)">○ 正解</button></div>`}
  h+=`<div class="nav"><button class="nb" onclick="pv()">◀ 前へ</button><button class="nb pri" onclick="fp()">裏返す</button><button class="nb" onclick="nx()">次へ ▶</button></div>`;
  a.innerHTML=h;
